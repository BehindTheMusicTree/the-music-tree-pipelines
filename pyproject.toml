[tool.uv.workspace]
members = ["pipelines/*"]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "pytest==9.1.1",
    "pre-commit==4.6.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["pipelines"]
addopts = "--ignore-glob=*/vendor/*"
markers = [
    "integration: requires a local Postgres loaded from the MusicBrainz sample dataset (see the relevant pipeline's TESTING.md)",
]
