[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "root-the-music-tree"
version = "0.1.0"
description = "Giving MusicBrainz's flat genre list some roots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "polars==1.42.1",
    "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pytest==9.1.1",
]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/root-the-music-tree"

[tool.hatch.build.targets.wheel]
packages = ["src/root_the_music_tree"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a local Postgres loaded from the MusicBrainz sample dataset (see TESTING.md)",
]
