[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "common"
version = "0.1.0"
description = "Shared utilities for the-music-tree-pipelines pipelines."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.2",
]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/the-music-tree-pipelines"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
