[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "gold"
version = "1.2.0"
description = "Consumer-facing exports: canonical genre tree and songs reconciled against it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "polars==1.42.1",
    "pyarrow==25.0.1",
    "jsonschema==4.26.0",
    "common",
]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/the-music-tree-pipelines"

[tool.hatch.build.targets.wheel]
packages = ["src/gold"]

[tool.uv.sources]
common = { workspace = true }
