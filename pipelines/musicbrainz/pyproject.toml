[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "musicbrainz"
version = "1.1.0"
description = "Giving MusicBrainz's flat genre list some roots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "adbc-driver-postgresql==1.12.0",
    "httpx==0.28.1",
    "polars==1.42.1",
    "pyarrow==25.0.1",
    "tenacity==9.1.2",
    "common",
]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/the-music-tree-pipelines"

[tool.hatch.build.targets.wheel]
packages = ["src/musicbrainz"]

[tool.uv.sources]
common = { workspace = true }
