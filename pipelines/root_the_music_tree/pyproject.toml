[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "root-the-music-tree"
version = "0.1.0"
description = "Giving MusicBrainz's flat genre list some roots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "polars==1.42.1",
    "psycopg[binary]==3.3.4",
]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/the-music-tree-pipelines"

[tool.hatch.build.targets.wheel]
packages = ["src/root_the_music_tree"]
