[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "wikidata"
version = "0.1.0"
description = "Wikidata's music genre tree (P279 subclass-of hierarchy), ingested from the public SPARQL endpoint."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "polars==1.42.1",
    "httpx==0.28.1",
    "tenacity==9.1.2",
    "common",
]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/the-music-tree-pipelines"

[tool.hatch.build.targets.wheel]
packages = ["src/wikidata"]

[tool.uv.sources]
common = { workspace = true }
