[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "geohistory"
version = "0.1.0"
description = "Cultural-entity backbone for the music-traditions genealogy: Glottolog languoids (Bronze)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "polars==1.42.1",
    "httpx==0.28.1",
    "tenacity==9.1.2",
    "common",
]

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/the-music-tree-pipelines"

[tool.hatch.build.targets.wheel]
packages = ["src/geohistory"]

[tool.uv.sources]
common = { workspace = true }
