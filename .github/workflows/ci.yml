name: Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: "1.7.12"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run tests
        run: uv run pytest -m "not integration"

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache MusicBrainz Docker images
        id: mb-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/mb-docker-images.tar
          key: mb-docker-images-${{ hashFiles('pipelines/musicbrainz_to_the_music_tree_api/vendor/musicbrainz-docker/build/postgres-prebuilt/Dockerfile', 'pipelines/musicbrainz_to_the_music_tree_api/vendor/musicbrainz-docker/build/musicbrainz-prebuilt/Dockerfile') }}

      - name: Load cached images
        if: steps.mb-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/mb-docker-images.tar

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Load MusicBrainz sample dataset
        run: pipelines/musicbrainz_to_the_music_tree_api/scripts/setup-sample-db.sh

      - name: Save image cache
        if: steps.mb-image-cache.outputs.cache-hit != 'true'
        run: docker save musicbrainz-docker_db:18 musicbrainz-docker-musicbrainz:latest -o /tmp/mb-docker-images.tar

      - name: Run integration tests
        env:
          MB_TEST_REQUIRE_DB: "1"
          PGPASSWORD: musicbrainz
        run: uv run pytest -m integration
