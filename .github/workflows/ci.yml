name: Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: "1.7.12"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not integration"

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache MusicBrainz Docker images
        id: mb-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/mb-docker-images.tar
          key: mb-docker-images-${{ hashFiles('vendor/musicbrainz-docker/build/postgres-prebuilt/Dockerfile', 'vendor/musicbrainz-docker/build/musicbrainz-prebuilt/Dockerfile') }}

      - name: Load cached images
        if: steps.mb-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/mb-docker-images.tar

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Load MusicBrainz sample dataset
        run: scripts/setup-sample-db.sh

      - name: Save image cache
        if: steps.mb-image-cache.outputs.cache-hit != 'true'
        run: docker save musicbrainz-docker_db:18 musicbrainz-docker-musicbrainz:latest -o /tmp/mb-docker-images.tar

      - name: Run integration tests
        run: |
          set +e
          pytest -m integration
          code=$?
          set -e
          # exit 5 = "no tests collected" -- expected until the first
          # @pytest.mark.integration test exists; treat as success.
          if [ "$code" = 5 ]; then exit 0; fi
          exit "$code"
